name: Validar código
on: [push, pull_request]
jobs:
  build-e-catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/catalogue-screen.test.mjs tests/consortium.test.mjs
